# Nginx per phantom-lab.eu
# Destinazione: /etc/nginx/sites-available/phantom-lab.eu
#
# Nota: applicare questo file DOPO aver ottenuto il certificato con Certbot.
# Al primo giro usare solo il blocco :80 senza redirect, altrimenti la
# validazione HTTP-01 non riesce.

# Limita i tentativi sugli endpoint sensibili (login, gate).
limit_req_zone $binary_remote_addr zone=phantomlab_auth:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name phantom-lab.eu www.phantom-lab.eu;

    # Certbot deposita qui i file di validazione.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://phantom-lab.eu$request_uri;
    }
}

# Normalizza www -> dominio senza www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.phantom-lab.eu;

    ssl_certificate     /etc/letsencrypt/live/phantom-lab.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phantom-lab.eu/privkey.pem;

    return 301 https://phantom-lab.eu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name phantom-lab.eu;

    ssl_certificate     /etc/letsencrypt/live/phantom-lab.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phantom-lab.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: attivare solo quando si è certi di restare su HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Il body serve solo per JSON di dimensioni ridotte.
    client_max_body_size 2m;

    access_log /var/log/nginx/phantomlab.access.log;
    error_log  /var/log/nginx/phantomlab.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Asset con hash nel nome: cache lunga.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Endpoint di autenticazione e gate: soggetti a rate limit.
    location ~ ^/api/(gate|auth)/ {
        limit_req zone=phantomlab_auth burst=8 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
