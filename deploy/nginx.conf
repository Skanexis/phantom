# Nginx per phantom-lab.eu
# Destinazione: /etc/nginx/sites-available/phantom-lab.eu
#
# Applicare questo file DOPO aver ottenuto il certificato con Certbot.
# Al primo giro serve solo il blocco :80 che fa da proxy (vedi DEPLOY.md
# sezione 9), altrimenti la validazione HTTP-01 non riesce.

# --- Limiti di frequenza ---------------------------------------------------
# Tre zone invece di una: gli endpoint hanno ritmi legittimi molto diversi,
# e un limite unico o strozza l'uso normale o lascia passare gli abusi.

# Password del cantiere e login Telegram: bersagli da forza bruta, dove un
# utente vero prova una volta ogni tanto. Stretto di proposito.
limit_req_zone $binary_remote_addr zone=phantomlab_auth:10m rate=12r/m;

# Attesa della conferma dal bot: il browser interroga ogni 2 secondi finché
# l'utente non preme Avvia su Telegram, cioè 30 richieste al minuto di uso
# perfettamente normale. Con la zona stretta qui sopra il collegamento si
# interrompeva da solo dopo una ventina di secondi, restituendo 503 proprio
# mentre l'utente stava completando l'accesso.
limit_req_zone $binary_remote_addr zone=phantomlab_collega:10m rate=45r/m;

# Resto dell'API: tetto largo, serve solo a fermare i cicli automatici.
limit_req_zone $binary_remote_addr zone=phantomlab_api:10m rate=120r/m;

# Pagine HTML. Mancava del tutto, ed era il buco più largo: il limite di
# frequenza copriva solo /api/, quindi una raffica su /richiesta — che è
# renderizzata per intero a ogni visita — non incontrava nessun freno qui e
# arrivava a Node ogni singola volta. Quattro al secondo con burst a 60 è
# molto più di quanto produca una persona: una navigazione carica una
# pagina, e gli asset hanno un blocco tutto loro che non consuma questo
# bilancio.
limit_req_zone $binary_remote_addr zone=phantomlab_pagine:10m rate=240r/m;

# 429 e non il 503 predefinito. Un 503 dice "il server è rotto" e manda a
# cercare il guasto dalla parte sbagliata; 429 dice "stai chiedendo troppo
# spesso", che è la verità, ed è anche ciò che i client corretti sanno
# interpretare per rallentare da soli.
limit_req_status 429;

# --- Cache della homepage --------------------------------------------------
# La pagina non dipende da chi la guarda (vedi il commento in cima a
# src/app/(sito)/page.tsx) e Next la rigenera solo quando il contenuto
# cambia. Restava però una richiesta a Node per ogni visita: poco lavoro
# ciascuna, ma moltiplicata per una raffica è comunque il processo
# dell'applicazione a doverla assorbire. Da qui in poi la assorbe Nginx, che
# per servire un file dalla memoria non deve svegliare nessuno.
proxy_cache_path /var/cache/nginx/phantomlab
                 levels=1:2
                 keys_zone=phantomlab_html:10m
                 max_size=256m
                 inactive=10m
                 use_temp_path=off;

# Connessioni simultanee per indirizzo. Con HTTP/2 un browser ne apre una
# sola e ci multiplexa tutto, quindi il valore è generoso anche per una rete
# aziendale dietro un unico IP; ferma invece chi ne apre a centinaia per
# tenere occupato il flusso SSE, che per natura resta appeso a lungo.
limit_conn_zone $binary_remote_addr zone=phantomlab_conn:10m;

# Un solo punto in cui è scritta la porta dell'app: se cambia, si tocca qui.
upstream phantomlab_app {
    server 127.0.0.1:3080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name phantom-lab.eu www.phantom-lab.eu;

    # Certbot deposita qui i file di validazione: deve restare raggiungibile
    # in HTTP anche dopo il passaggio a HTTPS, per i rinnovi automatici.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://phantom-lab.eu$request_uri;
    }
}

# Normalizza www -> dominio senza www.
server {
    # Sintassi `listen ... http2`: funziona da nginx 1.9 in poi. Su 1.25.1+
    # la direttiva separata `http2 on;` sarebbe preferibile, ma su versioni
    # precedenti fa fallire l'avvio con "unknown directive".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.phantom-lab.eu;

    ssl_certificate     /etc/letsencrypt/live/phantom-lab.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phantom-lab.eu/privkey.pem;

    return 301 https://phantom-lab.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phantom-lab.eu;

    ssl_certificate     /etc/letsencrypt/live/phantom-lab.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phantom-lab.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Il body serve solo per JSON di dimensioni ridotte.
    client_max_body_size 2m;

    # Non dichiarare la versione di Nginx nelle risposte e nelle pagine
    # d'errore: è la prima cosa che cerca chi scandaglia per versioni note.
    server_tokens off;

    # Tetto sulle connessioni simultanee (vedi la zona in cima al file).
    # Tenuto alto perché un ufficio dietro un solo IP pubblico conta come
    # un unico client: chi inonda ne apre centinaia, non decine.
    limit_conn phantomlab_conn 50;

    # Corpi e intestazioni lenti a proposito: un client che invia un byte
    # ogni tanto tiene occupato un worker senza mai completare la richiesta.
    client_body_timeout 15s;
    client_header_timeout 15s;

    # L'applicazione usa solo questi metodi. TRACE e le estensioni WebDAV
    # non servono a nulla qui e vanno respinte prima di raggiungere Next.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # File nascosti (.env, .git, .htaccess): non sono serviti da Next, ma
    # chiuderli qui evita che un errore di configurazione futuro li esponga.
    # L'eccezione è .well-known, che serve a Certbot per i rinnovi.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/phantomlab.access.log;
    error_log  /var/log/nginx/phantomlab.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Intestazioni comuni a tutti i proxy di questo server -------------
    # Dichiarate una volta sola qui: ogni location le eredita, purché non
    # aggiunga un proprio proxy_set_header (che sostituirebbe l'intero set).
    # Host è la più importante: senza, Next.js riceve "127.0.0.1:3080",
    # non riconosce la richiesta e restituisce gli asset come text/plain
    # (il browser li rifiuta con "MIME type is not executable").
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Asset con hash nel nome: immutabili, cache lunga lato browser.
    location /_next/static/ {
        proxy_pass http://phantomlab_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # File dentro public/: serviti da Next, cache moderata.
    location /_next/image {
        proxy_pass http://phantomlab_app;
    }

    # ATTENZIONE all'ordine: Nginx valuta le location regex nell'ordine in
    # cui compaiono e si ferma alla prima che corrisponde. Il blocco di
    # /api/auth/collega deve stare PRIMA di quello generico su /api/auth/,
    # altrimenti non verrebbe mai raggiunto e l'attesa della conferma
    # ricadrebbe di nuovo sotto il limite stretto.

    # Attesa della conferma dal bot: interrogazione ogni 2 secondi.
    location ~ ^/api/auth/collega {
        limit_req zone=phantomlab_collega burst=20 nodelay;
        proxy_pass http://phantomlab_app;
    }

    # Password del cantiere e login: limite stretto contro la forza bruta.
    location ~ ^/api/(gate|auth)/ {
        limit_req zone=phantomlab_auth burst=8 nodelay;
        proxy_pass http://phantomlab_app;
    }

    # Il webhook del bot resta fuori dai limiti per IP: Telegram consegna
    # gli aggiornamenti da pochi indirizzi e a raffica quando recupera un
    # arretrato. Si difende con il segreto condiviso, non con la frequenza.
    #
    # Gli intervalli qui sotto sono quelli da cui Telegram consegna gli
    # aggiornamenti, e sono un secondo strato, non il primo: la difesa vera
    # resta il confronto a tempo costante del segreto dentro l'applicazione.
    # Quello che aggiungono è che una consegna falsificata non costa più un
    # passaggio completo dentro Node — muore qui.
    #
    # IL MODO IN CUI QUESTO SI ROMPE: se Telegram aggiunge un intervallo, il
    # bot smette di ricevere aggiornamenti e l'applicazione non se ne
    # accorge, perché a lei non arriva proprio nulla. Per questo il webhook
    # ha un log tutto suo — un rifiuto è una riga con 403, e la diagnosi è
    # un solo grep — e per questo esiste la sentinella in sorveglianza.ts,
    # che avvisa su Telegram quando il webhook tace da troppe ore. Vedi la
    # sezione 16 di docs/DEPLOY.md.
    #
    # Il log separato serve anche a un secondo scopo: Telegram consegna a
    # raffica quando recupera un arretrato, e quelle righe nel log comune
    # coprirebbero il traffico vero.
    location = /api/telegram/webhook {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;

        access_log /var/log/nginx/phantomlab.webhook.log;
        proxy_pass http://phantomlab_app;
    }

    # Resto dell'API: tetto largo, contro i cicli automatici.
    location /api/ {
        limit_req zone=phantomlab_api burst=40 nodelay;
        proxy_pass http://phantomlab_app;
    }

    # Flusso SSE delle notifiche: connessione lunga che spinge gli eventi
    # verso il browser. Ha regole proprie perché i valori predefiniti la
    # romperebbero in tre modi diversi, tutti silenziosi.
    location = /api/flusso {
        proxy_pass http://phantomlab_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Senza questo Nginx accumula gli eventi nel buffer e li consegna
        # tutti insieme: il "tempo reale" sparisce senza errori a video.
        proxy_buffering off;
        proxy_cache off;
        # La compressione bufferizza a sua volta, con lo stesso effetto.
        gzip off;
        # Il flusso resta aperto a lungo: con i 60s del blocco generale
        # cadrebbe di continuo, riconnettendosi a ogni minuto.
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # --- Homepage: l'unica pagina che si può servire dalla cache ----------
    #
    # "location = /" e non un prefisso: qui dentro finisce soltanto la
    # radice. Ogni altra pagina dipende da chi la guarda — /richiesta legge
    # i parametri e la sessione, /area-personale è personale per
    # definizione — e servirle da una copia condivisa significherebbe
    # mostrare a qualcuno i dati di qualcun altro.
    #
    # IL PUNTO DELICATO, senza il quale tutto questo blocco è inutile.
    # Il perimetro deposita il marcatore del dispositivo su ogni risposta
    # che passa (vedi `prosegui` in src/middleware.ts), e Nginx per
    # impostazione predefinita NON mette in cache una risposta che porta un
    # Set-Cookie. Il risultato sarebbe il rovescio esatto di quello che
    # serve: in cache finirebbero solo le visite di chi il marcatore ce l'ha
    # già, mentre una raffica — che arriva sempre da client senza cookie —
    # non ci finirebbe mai.
    #
    # Da qui le due direttive che vanno insieme e non hanno senso separate:
    #   proxy_ignore_headers Set-Cookie  -> permette di conservare la copia;
    #   proxy_hide_header    Set-Cookie  -> impedisce di consegnarla a tutti.
    # Senza la seconda, ogni visitatore riceverebbe lo STESSO identificativo
    # di dispositivo, e il bando per dispositivo smetterebbe di distinguere
    # chiunque da chiunque altro.
    #
    # Il prezzo, accettato consapevolmente: chi apre la homepage da anonimo
    # non riceve il marcatore lì. Lo riceve alla prima richiesta successiva
    # — un link interno, una chiamata all'API — quindi lo perde solo chi
    # arriva e se ne va senza toccare nulla, cioè chi non stiamo seguendo.
    # Gli scanner i cookie non li conservano in nessun caso.
    #
    # Secondo prezzo: una risposta servita dalla cache non arriva a Node,
    # quindi non compare né nella console della sorveglianza né nell'archivio
    # Logs. Con 60 secondi di validità un vero visitatore al minuto passa
    # comunque, quindi il polso resta; e una raffica la vede benissimo
    # CrowdSec nei log di Nginx, che è il posto giusto per fermarla.
    #
    # Terzo prezzo, il meno ovvio: chi è escluso continua a vedere QUESTA
    # pagina, perché la copia in cache viene servita senza chiedere niente a
    # Node, e Nginx non sa chi è bandito. Su tutto il resto — ogni altra
    # pagina, ogni chiamata all'API — l'esclusione vale come prima. È un
    # compromesso accettato: a chi è bandito serviamo un volantino
    # statico che non ci costa nulla, e il blocco vero di quel traffico è
    # compito del firewall (CrowdSec), non del proxy.
    #
    # Le risposte diverse da 200 non entrano in cache (vedi
    # proxy_cache_valid): il 403 di chi è escluso e la pagina di attesa del
    # cantiere non possono quindi finire nella copia condivisa.
    location = / {
        limit_req zone=phantomlab_pagine burst=60 nodelay;

        proxy_pass http://phantomlab_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache phantomlab_html;
        proxy_cache_valid 200 60s;
        proxy_cache_key "$scheme$host$request_uri";

        # Chi ha una sessione aperta, o è entrato nel cantiere, non legge e
        # non scrive la copia condivisa: la sua pagina è la sua.
        proxy_cache_bypass $cookie_phantomlab_sessione $cookie_phantomlab_gate;
        proxy_no_cache     $cookie_phantomlab_sessione $cookie_phantomlab_gate;

        # Set-Cookie: vedi il ragionamento qui sopra.
        #
        # Cache-Control ed Expires: Next dichiara sulla homepage
        # "s-maxage=3600, stale-while-revalidate=31532400", e Nginx darebbe
        # retta a lui invece che al proxy_cache_valid qui sotto — tenendo la
        # copia un'ora. Il guaio è che una modifica fatta dal pannello
        # rigenera la pagina dentro Next (revalidatePath) ma non tocca la
        # copia di Nginx: il testo cambiato resterebbe invisibile fino a
        # un'ora, senza che nulla lo spieghi. Ignorandoli, il tempo lo
        # decidiamo qui, ed è un minuto.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header    Set-Cookie;

        # Con la copia scaduta e cento richieste insieme, una sola va a
        # rigenerarla e le altre aspettano quella: senza, si sveglierebbero
        # cento rigenerazioni contemporanee proprio sul picco.
        proxy_cache_lock on;
        # Applicazione ferma o in riavvio: meglio una homepage di un minuto
        # fa che una pagina d'errore.
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;

        # HIT/MISS/BYPASS visibile da curl: è il modo di verificare che
        # questo blocco stia davvero funzionando.
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        limit_req zone=phantomlab_pagine burst=60 nodelay;

        proxy_pass http://phantomlab_app;

        # ATTENZIONE: proxy_set_header non è additivo. Dichiararne anche uno
        # solo qui dentro annulla TUTTI quelli del blocco server, Host
        # compreso. Per questo il set va ripetuto per intero.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
