# Destinazione: /etc/nginx/conf.d/upgrade-map.conf
#
# Definisce $connection_upgrade, usato dal blocco WebSocket di nginx.conf.
# Va nel contesto `http`, non dentro un server: per questo è un file a parte.
#
# Se un altro sito su questo server definisce già la stessa map, nginx dà
# "duplicate variable" al test: in quel caso NON installare questo file,
# la variabile esiste già ed è la stessa.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
